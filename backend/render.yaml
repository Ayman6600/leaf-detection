services:
  # Backend Service
  - type: web
    name: leaf-detection-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
    autoDeploy: true

  # Frontend Static Site (can be done here or Cloudflare)
  # Keeping it out to stick to the user's Cloudflare Request for frontend
